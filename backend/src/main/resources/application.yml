    model: claude-haiku-4-5-20251001
    max-tokens: 64000

session:
  max-concurrent-sessions: 1

pdf:
  max-size-bytes: 31457280 # 30MB

app:
  base-url: http://localhost:8080
  frontend-url: http://localhost:5173

mail:
  from:
    address: ${MAIL_FROM_ADDRESS:${GMAIL_USERNAME:dev@gmail.com}}

---
spring:
  config:
    activate:
      on-profile: prod
  mvc:
    async:
      request-timeout: 600000  # 10 minutes for long-running document processing
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

openai:
  api:
    key: ${OPENAI_API_KEY}
    url: https://api.openai.com/v1/responses
    model: gpt-5
    max-tokens: 128000

claude:
  api:
    key: ${CLAUDE_API_KEY}
    url: https://api.anthropic.com/v1/messages
    model: claude-haiku-4-5-20251001
    max-tokens: 64000

session:
  max-concurrent-sessions: 1

pdf:
  max-size-bytes: 31457280 # 30MB

app:
  base-url: ${BASE_URL:https://api.example.com}
  frontend-url: ${FRONTEND_URL:https://example.com}

mail:
  from:
    address: ${MAIL_FROM_ADDRESS:${GMAIL_USERNAME}}
