spring:
  application:
    name: ai-professor
  profiles:
    active: ${PROFILE:dev}

---
spring:
  config:
    activate:
      on-profile: test
  mvc:
    async:
      request-timeout: 900000  # 10 minutes for long-running document processing
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@gmail.com
    password: test-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:mysql://localhost:3306/aiprofessor_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: test1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256-algorithm
  expiration: 86400000 # 24 hours

openai:
  api:
    key: test-mock-api-key
    url: https://api.openai.com/v1/responses
    model: gpt-5
    max-tokens: 128000

claude:
  api:
    key: test-mock-api-key
    url: https://api.anthropic.com/v1/messages
    model: claude-haiku-4-5-20251001
    max-tokens: 64000

session:
  max-concurrent-sessions: 1

pdf:
  max-size-bytes: 31457280 # 30MB

app:
  base-url: http://localhost:8080
  frontend-url: http://localhost:5173
  name: AI Professor

mail:
  from:
    address: test@gmail.com

---
spring:
  config:
